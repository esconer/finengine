[project]
name = "backend"
version = "0.1.0"
description = "Daisy Risk Engine - FastAPI backend for financial risk analytics"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Daisy Risk Engine", email = "dev@example.com"}
]

dependencies = [
    # Core Dependencies
    "fastapi[standard]",
    "uvicorn[standard]",
    "yfinance",
    "pandas",
    "numpy",
    "scipy",
    # Financial Analytics (simplified for now)
    "arch",
    "quantstats",
    "statsmodels",
    # Database & ORM
    "sqlalchemy",
    "alembic",
    # Utilities
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "requests",
    "aiohttp",
    "aiosqlite>=0.21.0",
    "scikit-learn>=1.7.2",
    "ipython>=9.6.0",
    "cvxpy>=1.6.0",
    "quantlib>=1.40",
    "stockstats>=0.6.8",
    "hmmlearn>=0.3.3",
    "bfinance>=0.1.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.12.0",
    "pytest-xdist>=3.6.1",
    "httpx==0.28.0",
    "faker==33.1.0",
    "factory-boy==3.3.0",
    "freezegun==1.4.0",
    "responses==0.25.0",
]

[tool.uv]
python-downloads = "automatic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=app --cov-report=html --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "api: API tests",
    "websocket: WebSocket tests",
    "database: Database tests",
    "slow: Slow running tests",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]

version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: daisy-risk-engine-backend:local
    container_name: daisy-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/backend/data/daisy.db
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./backend/data:/app/backend/data
    networks:
      - daisy-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, sqlite3, urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close();
          url = os.environ['DATABASE_URL'];
          path = url.rsplit('///', 1)[1];
          conn = sqlite3.connect(path, timeout=3);
          ok = conn.execute('PRAGMA quick_check').fetchone()[0];
          conn.close();
          assert ok == 'ok', ok
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: daisy-risk-engine-frontend:local
    container_name: daisy-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - daisy-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

networks:
  daisy-network:
    driver: bridge

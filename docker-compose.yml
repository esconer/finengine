version: '3.8'

services:
  # Backend service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: daisy-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/daisy.db
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./backend/data:/app/backend/data
      - ./logs:/app/logs
    networks:
      - daisy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: daisy-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - daisy-network
    depends_on:
      - backend
    restart: unless-stopped

  # Database (SQLite for development)
  database:
    image: nouchka/sqlite3
    container_name: daisy-database
    ports:
      - "3306:3306"
    environment:
      - DB_NAME=daisy.db
    volumes:
      - ./backend/data:/data
    networks:
      - daisy-network
    restart: unless-stopped

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: daisy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - daisy-network
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: daisy-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl
    networks:
      - daisy-network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

networks:
  daisy-network:
    driver: bridge

volumes:
  redis_data:
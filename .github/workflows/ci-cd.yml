name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Backend Tests and Build
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}

    - name: Install dependencies
      working-directory: backend
      run: |
        uv pip install --frozen-lockfile

    - name: Run backend linting
      working-directory: backend
      run: |
        uv pip install ruff
        ruff check .
        ruff format --check .

    - name: Run backend type checking
      working-directory: backend
      run: |
        uv pip install mypy
        mypy app/ --ignore-missing-imports

    - name: Run backend tests
      working-directory: backend
      run: |
        uv pip install pytest pytest-asyncio pytest-cov
        pytest tests/ --cov=app --cov-report=xml --cov-report=html --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage

    - name: Build backend Docker image
      run: |
        docker build -f backend/Dockerfile -t $REGISTRY/$IMAGE_NAME-backend:latest backend/

    - name: Push backend image to registry
      if: github.ref == 'refs/heads/main'
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin
        docker push $REGISTRY/$IMAGE_NAME-backend:latest

  # Frontend Tests and Build
  frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: Run frontend linting
      working-directory: frontend
      run: npm run lint

    - name: Run frontend type checking
      working-directory: frontend
      run: npm run type-check

    - name: Run frontend tests
      working-directory: frontend
      run: npm run test:coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage

    - name: Build frontend
      working-directory: frontend
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

    - name: Build frontend Docker image
      run: |
        docker build -f frontend/Dockerfile -t $REGISTRY/$IMAGE_NAME-frontend:latest frontend/

    - name: Push frontend image to registry
      if: github.ref == 'refs/heads/main'
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin
        docker push $REGISTRY/$IMAGE_NAME-frontend:latest

  # Security Scanning
  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run dependency check
      uses: dependencies/dependency-review-action@v3

  # Performance Testing
  performance:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v10
      with:
        configPath: './lighthouserc.json'
        uploadArtifacts: true
        temporaryPublicStorage: true

  # Integration Tests
  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Run integration tests
      run: |
        docker-compose -f docker-compose.yml up -d --wait
        sleep 60  # Wait for services to be ready
        
        # Run API tests
        cd backend && uv run pytest tests/integration/ -v
        
        # Run E2E tests
        cd frontend && npm run test:e2e
        
        # Cleanup
        docker-compose -f docker-compose.yml down

  # Deployment to Production
  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend, security, performance, integration]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://daisy-risk-engine.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push backend image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: daisy-risk-engine-backend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG backend/
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Build, tag, and push frontend image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: daisy-risk-engine-frontend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG frontend/
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region us-east-1 --name daisy-risk-engine-prod

    - name: Deploy to EKS
      run: |
        # Update deployment manifests with new image tags
        sed -i "s|image: .*|image: $ECR_REGISTRY/daisy-risk-engine-backend:$IMAGE_TAG|g" k8s/backend-deployment.yaml
        sed -i "s|image: .*|image: $ECR_REGISTRY/daisy-risk-engine-frontend:$IMAGE_TAG|g" k8s/frontend-deployment.yaml
        
        # Apply manifests
        kubectl apply -f k8s/
        
        # Wait for rollout to complete
        kubectl rollout status deployment/backend -n daisy-risk-engine --timeout=300s
        kubectl rollout status deployment/frontend -n daisy-risk-engine --timeout=300s

    - name: Run post-deployment tests
      run: |
        sleep 30  # Wait for services to be ready
        
        BACKEND_URL="https://api.daisy-risk-engine.com"
        FRONTEND_URL="https://daisy-risk-engine.com"
        
        # Health check
        curl -f "$BACKEND_URL/health" || exit 1
        
        # Smoke tests
        curl -f "$BACKEND_URL/api/v1/analytics/summary" || exit 1
        
        # Frontend check
        curl -f "$FRONTEND_URL" || exit 1

    - name: Notify deployment status
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: |
          Deployment ${{ job.status }} - Commit: ${{ github.sha }}
          Backend: ${{ needs.backend.outputs.image }}
          Frontend: ${{ needs.frontend.outputs.image }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # Notification for failed deployments
  notify-failure:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: failure()
    steps:
    - name: Notify failure
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#alerts'
        text: 'Deployment failed! Please check the logs and take appropriate action.'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
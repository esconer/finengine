name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Backend Tests and Build
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    # Pin the uv cache to a constant location so the cached path below is
    # authoritative. Left to its own devices uv picks $XDG_CACHE_HOME/uv, so a
    # runner image that sets XDG_CACHE_HOME elsewhere would make the cache
    # unreadable and silently pay the full download on every run.
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    # `uv` is the installer above, so `~/.cache/pip` was never read by anything
    # and every run re-downloaded and re-linked the whole scientific stack.
    # Caching uv's own cache instead, keyed on the lockfile, is where the
    # backend job's wall clock actually goes. actions/cache v3 is retired
    # (Node 16); v4 is SHA-pinned below with the version in a trailing comment.
    - name: Cache uv dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: /tmp/.uv-cache
        key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install dependencies
      working-directory: backend
      run: |
        uv sync --frozen --extra dev --group dev

    - name: Run backend linting
      working-directory: backend
      run: |
        uv run ruff check --no-cache .

    # -m "not integration" excludes tests/integration/test_compose_services.py.
    # It probes 127.0.0.1:8000 and :3000, which nothing is listening on at this
    # point in the job, so collecting it here failed the build on every push. It
    # is still marked (not deleted) and still runs, standalone, in the
    # `integration` job once Compose is up.
    - name: Run backend tests with 80% coverage gate
      working-directory: backend
      run: |
        uv run pytest -p no:cacheprovider tests/ -m "not integration" --cov=app --cov-fail-under=80 --cov-report=xml --cov-report=term

    - name: Build backend Docker image
      run: |
        docker build -f backend/Dockerfile -t $REGISTRY/$IMAGE_NAME-backend:latest backend/

    - name: Push backend image to registry
      if: github.ref == 'refs/heads/main'
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin
        docker push $REGISTRY/$IMAGE_NAME-backend:latest

  # Frontend Tests and Build
  frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      working-directory: frontend
      run: bun install --frozen-lockfile

    - name: Run frontend type checking
      working-directory: frontend
      run: bun x tsc --noEmit

    # Errors only, deliberately. `frontend/package.json`'s `lint` script is a
    # bare `eslint` with no --max-warnings, so this command exits non-zero on
    # errors alone. The tree currently stands at 0 errors / ~271 warnings, and
    # that warning backlog is not clearable in one commit -- gating on warnings
    # here would block every push for a count nobody signed up to fix, so
    # warnings stay a report and only errors fail the build.
    - name: Run frontend linting
      working-directory: frontend
      run: bun x eslint src/

    - name: Run frontend unit & component tests
      working-directory: frontend
      run: bun run test:run

    - name: Build frontend
      working-directory: frontend
      run: bun run build
      env:
        NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000/api/v1' }}

    - name: Build frontend Docker image
      run: |
        docker build -f frontend/Dockerfile -t $REGISTRY/$IMAGE_NAME-frontend:latest frontend/

    - name: Push frontend image to registry
      if: github.ref == 'refs/heads/main'
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin
        docker push $REGISTRY/$IMAGE_NAME-frontend:latest

  # Security Scanning
  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Pinned to the v0.36.0 release commit. This was the only mutable
    # ref in the file (`@master`), which is a supply-chain hazard: whatever
    # is on master at run time is what executes here.
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run dependency check
      uses: dependencies/dependency-review-action@v3

  # Integration Tests
  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Run published-service integration test
      run: |
        set -euo pipefail
        cleanup() { docker compose -f docker-compose.yml down; }
        trap cleanup EXIT
        docker compose -f docker-compose.yml up -d --build --wait
        python backend/tests/integration/test_compose_services.py

  # Build and publish production image artifacts. This repository has no
  # checked-in rollout target, so this job deliberately does not claim to deploy
  # or probe an unrelated externally hosted service.
  production-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend, security, integration]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://daisy-risk-engine.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    - name: Build, tag, and push backend image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: daisy-risk-engine-backend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG backend/
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Build, tag, and push frontend image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: daisy-risk-engine-frontend
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG frontend/
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Notify image publish status
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: |
          Production image publish ${{ job.status }} - Commit: ${{ github.sha }}
          Backend and frontend artifacts were pushed to the configured ECR repositories.
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # Notification for failed image publishing
  notify-failure:
    runs-on: ubuntu-latest
    needs: [production-images]
    if: failure()
    steps:
    - name: Notify failure
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#alerts'
        text: 'Deployment failed! Please check the logs and take appropriate action.'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
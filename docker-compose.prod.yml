version: "3.8"

services:
  backend:
    image: ${BACKEND_IMAGE:-daisy-risk-engine-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daisy-backend-prod
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/backend/data/daisy.db
      ENVIRONMENT: production
      LOG_LEVEL: WARNING
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - app_data:/app/backend/data
    networks:
      - daisy-prod-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, sqlite3, urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close();
          url = os.environ['DATABASE_URL'];
          path = url.rsplit('///', 1)[1];
          conn = sqlite3.connect(path, timeout=3);
          ok = conn.execute('PRAGMA quick_check').fetchone()[0];
          conn.close();
          assert ok == 'ok', ok
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  frontend:
    image: ${FRONTEND_IMAGE:-daisy-risk-engine-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: daisy-frontend-prod
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL:-http://127.0.0.1:8000}
      NEXT_PUBLIC_WS_URL: ${WS_URL:-ws://127.0.0.1:8000}
      PORT: 3000
    networks:
      - daisy-prod-network
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

networks:
  daisy-prod-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  app_data:
    driver: local
